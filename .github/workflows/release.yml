name: Release TUI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            target: bun-linux-x64
            extension: ''
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: bun-linux-arm64
            extension: ''
          - platform: darwin-x64
            os: macos-15-intel
            target: bun-darwin-x64
            extension: ''
          - platform: darwin-arm64
            os: macos-15
            target: bun-darwin-arm64
            extension: ''
          - platform: windows-x64
            os: windows-2025
            target: bun-windows-x64
            extension: .exe
          - platform: windows-arm64
            os: windows-11-arm
            target: bun-windows-arm64
            extension: .exe
    defaults:
      run:
        shell: bash
    env:
      BUN_TARGET: ${{ matrix.target }}
      BINARY: task-tui${{ matrix.extension }}
      ASSET: task-tui-${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate release API URL
        env:
          TASKINK_API_URL: ${{ secrets.TASKINK_API_URL }}
        run: |
          node --input-type=module <<'NODE'
          try {
            const value = process.env.TASKINK_API_URL ?? '';
            const url = new URL(value);
            if (
              !['http:', 'https:'].includes(url.protocol) ||
              url.username || url.password || value !== value.trim()
            ) {
              throw new Error('Invalid API URL');
            }
          } catch {
            console.error('::error::Set the TASKINK_API_URL repository secret to an HTTP(S) backend URL without credentials.');
            process.exit(1);
          }
          NODE

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Compile standalone TUI
        env:
          TASKINK_API_URL: ${{ secrets.TASKINK_API_URL }}
        run: |
          TASKINK_API_URL_JSON="$(node -p 'JSON.stringify(process.env.TASKINK_API_URL)')"
          mkdir -p dist release
          bun build src/tui/main.tsx \
            --compile \
            --target "$BUN_TARGET" \
            --minify \
            --define 'process.env.NODE_ENV="production"' \
            --define 'process.env.DEV=undefined' \
            --define "process.env.TASKINK_API_URL=$TASKINK_API_URL_JSON" \
            --no-compile-autoload-dotenv \
            --no-compile-autoload-bunfig \
            --outfile "dist/$BINARY"

      - name: Check standalone startup
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { mkdtempSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join, resolve } from 'node:path';

          // Run outside the checkout to catch missing bundled dependencies/assets.
          const cwd = mkdtempSync(join(tmpdir(), 'task-tui-release-'));
          try {
            const result = spawnSync(resolve('dist', process.env.BINARY), [], {
              cwd,
              encoding: 'utf8',
              timeout: 30_000,
            });
            if (result.error) throw result.error;
            // A noninteractive invocation must reach the TUI's terminal guard.
            assert.equal(result.status, 1, result.stdout + result.stderr);
            assert.match(result.stderr, /Task-TUI needs an interactive terminal/);
          } finally {
            rmSync(cwd, { recursive: true, force: true });
          }
          NODE

      - name: Archive Linux and macOS binary
        if: runner.os != 'Windows'
        run: tar -czf "release/$ASSET.tar.gz" -C dist "$BINARY"

      - name: Archive Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:BINARY" -DestinationPath "release/$env:ASSET.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: main-${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: task-tui-*
          path: release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release
        run: sha256sum *.tar.gz *.zip > SHA256SUMS.txt

      - name: Publish binaries
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "Task-TUI main #$GITHUB_RUN_NUMBER" \
              --generate-notes
          fi
